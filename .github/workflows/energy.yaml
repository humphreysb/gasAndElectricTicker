name: RateSavvy Data Pipeline

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: "0 13 * * *" # Runs daily at 13:00 UTC

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fast pre-flight: catches a misregistered scraper / missing providers
      # entry / drifted column schema before we hit the live sites and
      # potentially corrupt allData.parquet.
      - name: Run interface + schema tests
        run: python -m unittest discover tests -v

      # The scraper is internally tolerant — a single state's failure is
      # logged but doesn't abort the rest. We still want to fail the run
      # if EVERY scraper fails (the dispatcher exits 1 in that case).
      - name: Run scraper
        run: python energy_scraper.py

      # Re-run schema tests AFTER scraping so we catch any new state whose
      # output drifts from the union schema before it goes live.
      - name: Post-scrape schema verification
        run: python -m unittest tests.test_data_schema -v

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Commit updates
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Daily energy update" || echo "No changes to commit"
          git push